# Публичная отдача сгенерированных карточек товаров.
# Блок входит в server splithome.ru (443) в /etc/nginx/sites-enabled/splithome.ru.
#
# История: до 31.08.2026 здесь стоял proxy_pass на https://213.109.202.45 —
# старый VPS, выключенный при переезде 19.07.2026. Модификатор ^~ давал этой
# локации приоритет над общим `location /static/`, поэтому КАЖДЫЙ запрос
# карточки уходил на мёртвый хост и возвращал 404, хотя файлы всё это время
# лежали локально. Из-за этого карточки нельзя было отдать ни VK, ни любому
# другому потребителю по ссылке.
#
# Кириллица в именах файлов (rusklimat__НС-1498994.png) работает штатно:
# проблема была не в кодировке, а в проксировании.

location ^~ /static/avito-cards/ {
    alias /opt/oasis/staticfiles/avito-cards/;
    expires 30d;
    add_header Cache-Control "public";
}
