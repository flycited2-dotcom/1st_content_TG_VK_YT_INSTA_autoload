# Короткие публичные ссылки VK-контент-завода.
# Внешний адрес остаётся читаемым, а UTM добавляются только при редиректе.
#
# Префиксы задаёт campaign_short_url() в content_factory/analytics/vk.py.
# Если там появится новый префикс, а здесь нет — ссылка в живом посте уйдёт
# в 404. Соответствие проверяется тестами в tests/test_deploy_units.py.

# Сервисный материал → форма записи на обслуживание (проверено: форма живая).
location ~ ^/go/svc([0-9]+)$ {
    return 302 /service/?utm_source=vk&utm_medium=organic_social&utm_campaign=content_factory&utm_content=vkp_$1;
}

# Устаревший формат первых публикаций; оставлен, чтобы старые посты не ломались.
location ~ ^/go/(vkp_[0-9]+)$ {
    return 302 https://splithome.ru/?utm_source=vk&utm_medium=organic_social&utm_campaign=content_factory&utm_content=$1;
}

# ── Каталожные направления ──────────────────────────────────────────────────
# Разворачиваются НЕ здесь: они живут на climat-simf.ru и отдаются приложением
# (HTTP 307), а не nginx. Здесь карта зафиксирована, потому что другого места
# в репозитории у неё нет, а расхождение уже приводило к битым ссылкам.
#
#   /go/ac<id>   → https://climat-simf.ru/search?q=кондиционер
#   /go/hp<id>   → https://climat-simf.ru/search?q=тепловой+насос
#   /go/rc<id>   → https://climat-simf.ru/search?q=рекуператор
#   /go/vt<id>   → https://climat-simf.ru/search?q=вентиляция
#   /go/st<id>   → https://climat-simf.ru/search?q=стабилизатор
#   /go/ups<id>  → https://climat-simf.ru/search?q=источник+бесперебойного+питания
#
# Ко всем добавляются utm_source=vk, utm_medium=organic_social,
# utm_campaign=content_factory, utm_content=vkp_<id>.
