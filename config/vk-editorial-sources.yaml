topics:
  - id: clean-ac-filters
    category: air_conditioners
    content_type: useful
    title: Как часто очищать фильтры кондиционера
    intro: Простая профилактика помогает оборудованию работать в штатном режиме.
    cta: Сохраните памятку и отметьте дату следующей очистки фильтров.
    visual: Реальный мастер по климатической технике аккуратно снимает и очищает сетчатые фильтры открытого внутреннего блока настенного кондиционера в современной жилой комнате.
    facts:
      - id: clean-every-two-weeks
        text: В руководстве Daikin рекомендуется очищать воздушные фильтры раз в две недели.
        source: daikin_filter_guide
      - id: dry-in-shade
        text: После промывки фильтры следует просушить в тени.
        source: daikin_filter_guide
  - id: end-of-season-ac
    category: air_conditioners
    content_type: service
    title: Что сделать с кондиционером в конце сезона
    intro: Короткий чек-лист из официального руководства по эксплуатации.
    cta: Нужна диагностика или обслуживание — напишите в сообщения сообщества.
    visual: Реальный мастер проводит сезонное обслуживание открытого внутреннего блока настенного кондиционера в жилой квартире; рядом аккуратно лежат чистые фильтры и нейтральный набор инструмента.
    facts:
      - id: wash-filters
        text: В конце сезона руководство предписывает промыть или заменить фильтры.
        source: daichi_service_manual
      - id: dry-inside
        text: Перед длительным перерывом внутреннюю часть рекомендуют просушить работой в режиме вентиляции.
        source: daichi_service_manual
  - id: inverter-benefits
    category: air_conditioners
    content_type: comparison
    title: Инверторный или обычный кондиционер
    intro: Главное различие — способ управления производительностью компрессора.
    cta: Подберём решение под режим использования помещения и бюджет.
    visual: Фотореалистичный современный интерьер с настенным кондиционером, спокойная комфортная атмосфера, на столе точный бытовой термометр; визуальный акцент на стабильном комфорте без схем и надписей.
    facts:
      - id: inverter-precision
        text: Инверторная технология повышает точность поддержания температуры.
        source: daichi_inverter_catalog
      - id: inverter-noise-energy
        text: Официальный каталог связывает инверторное управление со снижением шума и расхода электроэнергии.
        source: daichi_inverter_catalog
  - id: multi-split-rooms
    category: air_conditioners
    content_type: comparison
    title: Когда стоит рассмотреть мульти-сплит-систему
    intro: Такой вариант применяют, когда климат нужен сразу в нескольких помещениях.
    cta: Перед выбором посчитаем помещения и проверим возможную трассировку.
    visual: "Фотореалистичный загородный дом в разрезе перспективы без инфографики: один наружный блок кондиционирования и несколько аккуратно установленных внутренних блоков в разных жилых комнатах, технически правдоподобные трассы скрыты."
    facts:
      - id: one-outdoor-many-indoor
        text: Мульти-сплит-система использует один наружный блок и несколько внутренних.
        source: daichi_multi
      - id: multi-zone
        text: Daichi позиционирует такое решение для многокомнатных и многозонных помещений.
        source: daichi_multi
  - id: recuperator-purpose
    category: recuperators
    content_type: useful
    title: Что делает рекуператор в системе вентиляции
    intro: Рекуперация не заменяет воздухообмен, а дополняет его возвратом энергии.
    cta: Для корректного подбора нужны параметры помещения и требуемый воздухообмен.
    visual: Фотореалистичный монтажник обслуживает компактную приточно-вытяжную установку с пластинчатым рекуператором в аккуратном техническом помещении частного дома; корпус открыт, теплообменник хорошо виден.
    facts:
      - id: heat-recovery
        text: Пластинчатый рекуператор утилизирует тепло или холод в системе вентиляции.
        source: breez_zrp
      - id: streams-separated
        text: В рекуператорах ZRP приточный и вытяжной воздушные потоки полностью разделены.
        source: breez_zrp
  - id: ventilation-selection
    category: ventilation
    content_type: useful
    title: Почему вентиляцию нельзя подбирать только по площади
    intro: Площадь важна, но инженерный подбор учитывает больше исходных данных.
    cta: Пришлите планировку и задачу — сформируем исходные данные для подбора.
    visual: Инженер по вентиляции изучает план жилого дома и выполняет замеры воздуха в современной комнате с помощью профессионального прибора; видны аккуратные потолочные вентиляционные решётки.
    facts:
      - id: operating-conditions
        text: Технический подбор учитывает условия эксплуатации объекта.
        source: breez_support
      - id: price-requirements
        text: При разработке решения также учитываются ценовые требования.
        source: breez_support
  - id: professional-selection
    category: climate
    content_type: trust
    title: Что входит в профессиональный подбор климатической техники
    intro: Хороший подбор начинается с задачи объекта, а не с названия модели.
    cta: Опишите помещение и желаемый результат — предложим подходящие варианты.
    visual: Опытный инженер по климатической технике обсуждает проект с владельцем дома за столом с планировкой помещений; в интерьере видны кондиционер и вентиляционная решётка, естественная деловая сцена.
    facts:
      - id: complex-solutions
        text: Инженерная поддержка включает разработку комплексных решений для объектов.
        source: breez_support
      - id: non-standard
        text: Официальная техническая поддержка отдельно учитывает сложные и нестандартные проекты.
        source: breez_support
  - id: ups-runtime
    category: ups
    content_type: useful
    title: От чего зависит время работы ИБП
    intro: Номинал батареи сам по себе не даёт универсального времени автономии.
    cta: Для подбора пришлите список оборудования и его потребляемую мощность.
    visual: Фотореалистичный источник бесперебойного питания без бренда питает домашний котёл и сетевое оборудование во время отключения электроэнергии; аккуратная техническая зона частного дома, реалистичные кабели.
    facts:
      - id: runtime-load
        text: POWERMAN указывает, что время автономной работы зависит от подключённой нагрузки.
        source: powerman_brick
      - id: protect-disturbances
        text: ИБП BRICK рассчитан на работу при отключении сети и отклонениях сетевого напряжения.
        source: powerman_brick
  - id: online-ups
    category: ups
    content_type: comparison
    title: Когда нужен ИБП класса Online
    intro: Такой класс выбирают для оборудования с повышенными требованиями к качеству питания.
    cta: Проверим тип нагрузки, мощность и требуемое время автономной работы.
    visual: Фотореалистичная серверная стойка малого бизнеса с аккуратно установленным источником бесперебойного питания класса Online без брендинга; инженер проверяет показатели оборудования, естественное техническое освещение.
    facts:
      - id: zero-transfer
        text: Для POWERMAN ONLINE заявлено нулевое время перехода с сети на батарею.
        source: powerman_online
      - id: demanding-equipment
        text: Серия ONLINE предназначена для серверов, автоматики и другого требовательного оборудования.
        source: powerman_online
  - id: stabilizer-measure-first
    category: stabilizers
    content_type: useful
    title: Почему стабилизатор нельзя выбирать без замеров напряжения
    intro: Мощность нагрузки важна, но сначала нужно понять, какое напряжение реально приходит на объект.
    cta: Перед подбором зафиксируйте минимальное и максимальное напряжение в сети в разные часы.
    visual: Профессиональный электрик измеряет входное напряжение цифровым мультиметром у распределительного щита частного дома; рядом установлен настенный стабилизатор без бренда, безопасная и технически правдоподобная сцена.
    facts:
      - id: working-and-limit-range
        text: У стабилизатора различают рабочий и предельный диапазоны входного напряжения.
        source: shtyl_selection
      - id: measure-real-network
        text: Контрольные замеры помогают определить реальные отклонения напряжения на объекте.
        source: shtyl_selection
  - id: stabilizer-range-and-power
    category: stabilizers
    content_type: comparison
    title: Почему одного широкого диапазона стабилизатора недостаточно
    intro: На нижней границе входного напряжения доступная выходная мощность может снижаться.
    cta: Сверяйте диапазон не только с рекламной цифрой, но и с графиком нагрузки конкретной модели.
    visual: Фотореалистичный электрик сравнивает показания входного напряжения и нагрузки на настенном стабилизаторе без бренда в техническом помещении; реалистичный дисплей без читаемых надписей и безопасный монтаж.
    facts:
      - id: is20000-limit-range
        text: Для модели Штиль IS20000 указан предельный входной диапазон 90–310 В.
        source: shtyl_is20000
      - id: is20000-full-load-range
        text: Полная нагрузка для этой модели доступна при входном напряжении 165–310 В, а ниже выходная мощность ограничивается.
        source: shtyl_is20000
  - id: stabilizer-ranges-differ
    category: stabilizers
    content_type: comparison
    title: Почему диапазон напряжения нужно проверять у каждой модели
    intro: Даже внутри одной категории стабилизаторы рассчитаны на разные условия сети.
    cta: Сопоставляйте паспортный диапазон модели с замерами на вашем объекте.
    visual: Фотореалистичная нейтральная витрина с двумя разными настенными стабилизаторами напряжения без брендов и надписей; рядом электрик держит прибор для измерения сети, естественная техническая сцена.
    facts:
      - id: powerman-range-example
        text: В официальном каталоге POWERMAN для разных серий указаны отличающиеся диапазоны входного напряжения.
        source: powerman_stabilizers
      - id: range-is-model-specific
        text: Поэтому диапазон необходимо сверять по характеристикам конкретной модели, а не по типу устройства в целом.
        source: powerman_stabilizers
  - id: heat-pump-cold-weather
    category: heat_pumps
    content_type: useful
    title: Что проверить перед выбором теплового насоса для обогрева
    intro: Рабочая температура на обогрев зависит от конкретной серии, а не только от слова «инвертор».
    cta: Сначала определите расчётную температуру региона и теплопотери помещения.
    visual: Фотореалистичный современный частный дом зимой, наружный блок воздушного теплового насоса работает у фасада, внутри через окно видна тёплая жилая комната; естественный снег и реалистичный монтаж.
    facts:
      - id: heatforce-air-to-air
        text: Серия HeatForce относится к тепловым насосам типа воздух–воздух.
        source: daichi_heatforce
      - id: heatforce-minus-thirty
        text: Для серии HeatForce производитель заявляет работу на обогрев при наружной температуре до −30 °C.
        source: daichi_heatforce
